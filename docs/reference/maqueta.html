<style>
/* Layout: desktop-app shell — top bar, collapsible nav rail, folder tree, options pane, command footer */
:root{
  --primary:#006EB3; --primary-ink:#ffffff; --primary-soft:#e3f0f9; --pin:#7B3FE4; --pin-soft:#efe8fd;
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#f6f8fb; --line:#dde3ea; --line-soft:#edf1f5;
  --fg:#1b2533; --muted:#5d6b7c; --faint:#94a1b1; --warn:#b45309; --ok:#047857; --ok-soft:#e6f6ef;
  --code-bg:#0e1726; --code-fg:#9fd2ff; --tip-bg:#1b2533; --tip-fg:#ffffff; --shadow:0 10px 30px rgba(16,40,70,.12);
  --f-ui:"Roboto","Segoe UI",system-ui,sans-serif; --f-mono:"Roboto Mono",Consolas,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --primary:#2b8fd6; --primary-ink:#ffffff; --primary-soft:#163049; --pin:#9a6bff; --pin-soft:#2a2245;
  --bg:#121821; --surface:#1a222d; --surface-2:#202a37; --line:#2c3847; --line-soft:#243040;
  --fg:#e5ebf2; --muted:#9aa8b8; --faint:#6b7a8c; --warn:#f0a050; --ok:#4cc69a; --ok-soft:#173a2f;
  --code-bg:#0a1018; --code-fg:#9fd2ff; --tip-bg:#e5ebf2; --tip-fg:#121821; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#2b8fd6; --primary-ink:#ffffff; --primary-soft:#163049; --pin:#9a6bff; --pin-soft:#2a2245;
  --bg:#121821; --surface:#1a222d; --surface-2:#202a37; --line:#2c3847; --line-soft:#243040;
  --fg:#e5ebf2; --muted:#9aa8b8; --faint:#6b7a8c; --warn:#f0a050; --ok:#4cc69a; --ok-soft:#173a2f;
  --code-bg:#0a1018; --code-fg:#9fd2ff; --tip-bg:#e5ebf2; --tip-fg:#121821; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:13px}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:flex;flex-direction:column;gap:12px;max-width:1400px;margin:0 auto}
.note{color:var(--muted);font-size:12.5px;line-height:1.5;max-width:90ch}
.note b{color:var(--fg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.app{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;height:680px;min-height:0}
.top{display:flex;align-items:center;gap:12px;background:var(--primary);color:var(--primary-ink);padding:8px 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:14px;white-space:nowrap}
.logo{background:#fff;color:#006EB3;font-weight:700;border-radius:6px;padding:3px 9px;letter-spacing:.4px;font-size:13px}
.search{flex:1;min-width:140px;max-width:420px;margin:0 auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.17);border-radius:6px;padding:5px 10px;color:rgba(255,255,255,.85)}
.search kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:rgba(255,255,255,.18);border-radius:4px;padding:1px 5px}
.tbtn{background:rgba(255,255,255,.14);border:0;border-radius:6px;padding:5px 9px;color:#fff;display:flex;align-items:center;gap:6px}
.tbtn:hover{background:rgba(255,255,255,.26)}
select.tbtn option{color:#1b2533}

.body{flex:1;display:flex;min-height:0}
.nav{width:196px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:8px 0;transition:width .18s ease}
.nav.min{width:56px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-left:3px solid transparent;padding:9px 16px;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden;width:100%}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button.on{background:var(--primary-soft);color:var(--primary);border-left-color:var(--primary);font-weight:500}
.nav svg{flex:none;width:18px;height:18px}
.nav .lbl{transition:opacity .12s}
.nav.min .lbl{opacity:0;pointer-events:none}
.nav .spacer{flex:1}
.nav .collapse{border-top:1px solid var(--line-soft);margin-top:4px}
.nav.min .collapse svg{transform:rotate(180deg)}

.tree{width:262px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.sect{padding:10px 14px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.sect .lnk{background:none;border:0;color:var(--primary);text-transform:none;letter-spacing:0;font-size:12px;font-weight:500;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px 10px;font-size:12px;color:var(--fg)}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip .star{color:#e8a317}
.rootbox{margin:0 14px 6px;padding:6px 8px;border:1px dashed var(--line);border-radius:6px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.tlist{flex:1;overflow:auto;padding:0 6px 10px}
.tn{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:5px;cursor:pointer;white-space:nowrap;color:var(--fg)}
.tn:hover{background:var(--surface-2)}
.tn.sel{background:var(--primary);color:var(--primary-ink)}
.tn .car{width:12px;color:var(--faint);flex:none;text-align:center}
.tn.sel .car{color:var(--primary-ink)}
.tn svg{width:15px;height:15px;flex:none;color:var(--primary)}
.tn.sel svg{color:var(--primary-ink)}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.info{margin:12px 14px 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.info .p{font-family:var(--f-mono);font-weight:500;font-size:13.5px;word-break:break-all}
.info .sub{color:var(--muted);font-size:12px;margin-top:2px}
.badge{font-size:11.5px;border-radius:10px;padding:2px 9px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);padding:8px 22px}
.btn.pri:hover{filter:brightness(1.08);color:var(--primary-ink)}
.ml{margin-left:auto}

.tabs{display:flex;gap:2px;margin:12px 14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:flex-end}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;color:var(--muted)}
.tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.tab .n{background:var(--surface-2);border-radius:9px;padding:0 6px;margin-left:5px;font-size:11px}
.tab.on .n{background:var(--primary-soft)}
.target{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--muted);padding-bottom:5px}
.sel2{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface);color:var(--fg);font:inherit}
.prof{margin:10px 14px 0;display:flex;gap:8px;align-items:center;color:var(--muted);flex-wrap:wrap}
.prof .lnk{background:none;border:0;color:var(--primary);padding:0;font-size:12px}

.opts{flex:1;overflow:auto;margin:8px 14px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:0}
.grp{padding:7px 14px;background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line-soft);position:sticky;top:0;z-index:1}
.row{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--line-soft);position:relative}
.row:hover{background:var(--surface-2)}
.cb{width:17px;height:17px;border-radius:4px;border:2px solid var(--line);background:var(--surface);flex:none;padding:0;display:inline-flex;align-items:center;justify-content:center}
.cb svg{width:11px;height:11px;opacity:0;color:#fff}
.cb.pin{border-color:var(--pin);opacity:.55}
.cb.pin:hover{opacity:1}
.cb.pin.on{background:var(--pin);opacity:1}
.cb.chk{border-color:color-mix(in srgb,var(--primary) 55%,var(--line))}
.cb.chk.on{background:var(--primary);border-color:var(--primary)}
.cb.on svg{opacity:1}
.flag{font-family:var(--f-mono);font-size:12.5px;cursor:help;white-space:nowrap}
.flag.warn{color:var(--warn)}
.desc{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.val{margin-left:auto;flex:none}
.val input,.val select{border:1px solid var(--line);border-radius:5px;padding:3px 7px;font:inherit;font-size:12px;background:var(--surface);color:var(--fg);width:150px}
.tip{position:absolute;left:62px;top:calc(100% - 2px);z-index:20;background:var(--tip-bg);color:var(--tip-fg);padding:9px 11px;border-radius:7px;font-size:12px;line-height:1.45;width:min(340px,80vw);box-shadow:var(--shadow);pointer-events:none}
.tip b{font-family:var(--f-mono);font-weight:500}

.foot{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap}
.cmd{flex:1;min-width:0;font-family:var(--f-mono);font-size:12px;background:var(--code-bg);color:var(--code-fg);border-radius:6px;padding:9px 11px;white-space:nowrap;overflow-x:auto}

.placeholder{margin:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:10px;max-width:640px}
.placeholder h3{margin:0;font-size:16px;font-weight:500}
.placeholder p{margin:0;color:var(--muted);line-height:1.55}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tip-bg);color:var(--tip-fg);padding:9px 16px;border-radius:7px;box-shadow:var(--shadow);font-size:13px;z-index:50}

.modal-bg{position:fixed;inset:0;background:rgba(10,20,35,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(440px,100%);overflow:hidden}
.modal .mh{background:var(--primary);color:var(--primary-ink);padding:20px 22px;display:flex;align-items:center;gap:12px}
.modal .mh .logo{font-size:16px;padding:5px 12px}
.modal .mh h3{margin:0;font-weight:500;font-size:17px}
.modal .mh small{opacity:.85}
.modal .mb{padding:18px 22px;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center}
.modal .mb dt{color:var(--muted);font-size:12px}
.modal .mb dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal a{color:var(--primary)}
.modal .mf{padding:12px 22px 18px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;gap:10px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--surface-2);border-radius:5px;padding:2px 8px;font-size:11.5px}
.mono{font-family:var(--f-mono)}

.legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .cb{pointer-events:none}

.status{display:flex;align-items:center;gap:8px;padding:5px 14px;border-top:1px solid var(--line);background:var(--surface-2);font-size:12px;color:var(--muted)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.status.ok .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.status.ok #engine{color:var(--ok);font-weight:500}
.status .ml{font-family:var(--f-mono);font-size:11px}
.madewith{color:var(--muted);font-size:12.5px;padding:0 22px 4px}

.story{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px 40px;padding-block:24px 8px;border-top:1px solid var(--line);margin-top:8px}
.story .lead{grid-column:1/-1;max-width:72ch}
.story h2{margin:0 0 8px;font-size:22px;font-weight:500;text-wrap:balance;color:var(--fg)}
.story h3{margin:0 0 8px;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;color:var(--primary)}
.story p,.story li{margin:0;line-height:1.65;color:var(--fg);font-size:14px;max-width:65ch}
.story p+p{margin-top:10px}
.story ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.story a{color:var(--primary);font-weight:500}
.story .lead p{font-size:15.5px;color:var(--muted)}
.story code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:4px;padding:0 4px}
.story .sig{grid-column:1/-1;color:var(--muted);font-size:13px;border-top:1px solid var(--line-soft);padding-top:14px}

@media (max-width:900px){
  .app{height:auto}
  .body{flex-direction:column}
  .nav{width:100%!important;flex-direction:row;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--line)}
  .nav button{width:auto;border-left:0;border-bottom:3px solid transparent;padding:10px 12px}
  .nav button.on{border-bottom-color:var(--primary)}
  .nav .lbl{opacity:1!important}
  .nav .spacer,.nav .collapse{display:none}
  .tree{width:100%;max-height:260px;border-right:0;border-bottom:1px solid var(--line)}
  .opts{max-height:460px}
  .target{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function find(id,list=TREE){for(const n of list){if(n.id===id)return n;if(n.kids){const r=find(id,n.kids);if(r)return r}}return null}

function renderNav(){
  const icons=['play','plus','prof','skill','hist','gear','about'];
  const tt=t();
  let h='';
  icons.forEach((ic,i)=>{ if(i===5) h+='<div class="spacer"></div>';
    h+=`<button class="${S.view===i?'on':''}" data-v="${i}" title="${S.navMin?esc(tt.nav[i]):''}">${I[ic]}<span class="lbl">${esc(tt.nav[i])}</span></button>`;});
  h+=`<button class="collapse" id="collapse" title="${esc(S.navMin?tt.expand:tt.collapse)}">${I.chev}<span class="lbl">${esc(tt.collapse)}</span></button>`;
  const nav=$('nav'); nav.innerHTML=h; nav.classList.toggle('min',S.navMin);
  nav.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=+b.dataset.v; if(v===6){openAbout();return} S.view=v;renderAll()});
  $('collapse').onclick=()=>{S.navMin=!S.navMin;save();renderNav()};
}

function treeHTML(list,depth){
  let h='';
  for(const n of list){
    const hasKids=n.kids&&n.kids.length; const car=hasKids?(n.open?'▾':'▸'):'';
    const ic=n.kind==='pc'?I.pc:n.kind==='drive'?I.drive:n.kind==='net'?I.net:I.folder;
    const name=n.name==='@pc'?t().pc:n.name;
    h+=`<div class="tn ${S.sel===n.id?'sel':''}" data-id="${n.id}" tabindex="0" style="padding-left:${8+depth*16}px"><span class="car">${car}</span>${ic}<span>${esc(name)}</span></div>`;
    if(hasKids&&n.open)h+=treeHTML(n.kids,depth+1);
  }
  return h;
}
function renderTree(){
  const tt=t();
  $('recTitle').textContent=tt.rec; $('foldTitle').textContent=tt.fold; $('chRoot').textContent=tt.chRoot;
  $('chips').innerHTML=[['idn',true],['web',true],['crm',false],['pru',false]].map(([id,f])=>`<button class="chip" data-id="${id}">${f?'<span class="star">★</span> ':''}${esc(find(id).name)}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.sel=c.dataset.id;S.view=0;renderAll()});
  $('tree').innerHTML=treeHTML(TREE,0);
  $('tree').querySelectorAll('.tn').forEach(el=>{
    const act=()=>{const n=find(el.dataset.id); if(n.kids&&n.kids.length)n.open=!n.open; if(n.path){S.sel=n.id;} S.view=0; renderAll();};
    el.onclick=act; el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}};
  });
}

function rowHTML(o){
  const on=!!S.on[o.id], pin=!!S.pin[o.id], tt=t();
  let val='';
  if(o.val){ const v=S.vals[o.id]??'';
    if(o.val.type==='select') val=`<span class="val"><select id="v-${o.id}" data-val="${o.id}">${o.val.opts.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select></span>`;
    else val=`<span class="val"><input id="v-${o.id}" data-val="${o.id}" value="${esc(v)}" placeholder="${esc(o.val.ph)}"></span>`;
  } else if(o.fixed) val=`<span class="val mono" style="color:var(--muted);font-size:12px">= ${o.fixed}</span>`;
  const tip='';
  return `<div class="row" data-row="${o.id}">
    <button class="cb pin ${pin?'on':''}" data-pin="${o.id}" title="${esc(tt.pinT)}" aria-pressed="${pin}">${I.ok}</button>
    <button class="cb chk ${on?'on':''}" data-chk="${o.id}" title="${esc(tt.chkT)}" aria-pressed="${on}">${I.ok}</button>
    <span class="flag ${o.warn?'warn':''}" data-tip="${o.id}" tabindex="0">${esc(o.flag)}</span>
    <span class="desc">${esc(o.d[S.lang])}</span>${val}${tip}</div>`;
}

function buildCmd(){
  const n=find(S.sel); const path=n.path||'C:\\';
  const envs=ENVS.filter(e=>S.on[e.id]).map(e=>[e.flag,e.fixed||S.vals[e.id]||e.val.ph]);
  const flags=FLAGS.filter(f=>S.on[f.id]).map(f=>{ if(!f.val) return f.flag; const v=S.vals[f.id]||f.val.ph; return f.flag+' '+(/\s/.test(v)?`'${v}'`:v)});
  const claude=['claude',...flags].join(' ');
  if(S.target==='wsl'){
    const wp='/mnt/'+path[0].toLowerCase()+path.slice(2).replace(/\\/g,'/');
    return `wt -d "${path}" wsl --cd "${wp}" -- ${envs.length?'env '+envs.map(([k,v])=>`${k}=${v}`).join(' ')+' ':''}${claude}`;
  }
  const ps=envs.map(([k,v])=>`$env:${k}='${v}'; `).join('')+claude;
  if(S.target==='ps') return `PS ${path}> ${ps}`;
  return `wt -d "${path}" pwsh -NoExit -Command "${ps}"`;
}

function renderMain(){
  const tt=t(), m=$('main');
  if(S.view!==0){
    m.innerHTML=`<div class="placeholder"><h3>${esc(tt.nav[S.view])}</h3><p><b>${esc(tt.phTitle)}.</b> ${esc(tt.phBody)}</p></div>`; return;
  }
  const n=find(S.sel), inf=n.info||{branch:null,md:false,skills:0,s:false};
  const list=S.tab==='p'?FLAGS:ENVS;
  const cntP=FLAGS.filter(f=>S.on[f.id]).length, cntE=ENVS.filter(f=>S.on[f.id]).length;
  let rows='';
  for(const g of ['model','perm','ctx','dbg']){ const items=list.filter(o=>o.g===g); if(!items.length)continue;
    rows+=`<div class="grp">${esc(tt.g[g])}</div>`+items.map(rowHTML).join(''); }
  m.innerHTML=`
   <div class="info">
     <div style="min-width:0"><div class="p">${esc(n.path||'')}</div><div class="sub">${esc(inf.s?tt.last:tt.none)}</div></div>
     ${inf.branch?`<span class="badge ok">⎇ ${esc(inf.branch)}</span>`:''}
     <span class="badge ${inf.md?'ok':''}">${esc(inf.md?tt.claudemd+' ✓':tt.noclaudemd)}</span>
     <span class="badge">${inf.skills} ${esc(tt.skills)}</span>
     <span class="ml"></span>
     ${inf.s?`<button class="btn" id="bCont">↺ ${esc(tt.cont)}</button><button class="btn">${esc(tt.resume)} ▾</button>`:''}
   </div>
   <div class="tabs">
     <button class="tab ${S.tab==='p'?'on':''}" data-tab="p">${esc(tt.tabP)}<span class="n">${cntP}</span></button>
     <button class="tab ${S.tab==='e'?'on':''}" data-tab="e">${esc(tt.tabE)}<span class="n">${cntE}</span></button>
     <span class="target">${esc(tt.target)} <select class="sel2" id="target">
       <option value="wt" ${S.target==='wt'?'selected':''}>Windows Terminal · PowerShell</option>
       <option value="ps" ${S.target==='ps'?'selected':''}>PowerShell</option>
       <option value="wsl" ${S.target==='wsl'?'selected':''}>Windows Terminal · WSL</option></select></span>
   </div>
   <div class="prof">${esc(tt.profile)}: <select class="sel2" id="prof"><option>PowerShell + Opus</option><option>Seguro</option><option>Autónomo</option></select><button class="lnk">${esc(tt.saveProf)}</button></div>
   <div class="opts" id="opts">${rows}</div>
   <div class="foot">
     <div class="cmd" id="cmd">${esc(buildCmd())}</div>
     <button class="btn" id="bCopy">${esc(tt.copy)}</button>
     <button class="btn" id="bReopen">${esc(tt.reopen)}</button>
     <button class="btn">${esc(tt.vscode)}</button>
     <button class="btn pri" id="bStart"><span style="display:inline-flex;width:12px;height:12px;vertical-align:-1px;margin-right:6px">${I.play}</span>${esc(tt.start)}</button>
   </div>`;
  m.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.hover=null;renderMain()});
  $('target').onchange=e=>{S.target=e.target.value;$('cmd').textContent=buildCmd()};
  m.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{const id=b.dataset.pin;
    if(S.pin[id]){delete S.pin[id];delete S.on[id]} else {S.pin[id]=true;S.on[id]=true}
    save();renderMain()});
  m.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>{const id=b.dataset.chk;
    if(S.on[id]){delete S.on[id];delete S.pin[id]} else {S.on[id]=true}
    save();renderMain()});
  m.querySelectorAll('[data-val]').forEach(el=>{
    const upd=()=>{S.vals[el.dataset.val]=el.value; S.on[el.dataset.val]=true; save(); $('cmd').textContent=buildCmd();
      const c=m.querySelector(`[data-chk="${el.dataset.val}"]`); c.classList.add('on');};
    el.oninput=upd; el.onchange=upd;});
  m.querySelectorAll('[data-tip]').forEach(el=>{
    el.onmouseenter=el.onfocus=()=>{S.hover=el.dataset.tip;showTip(el)};
    el.onmouseleave=el.onblur=()=>{S.hover=null;hideTip()};});
  $('bCopy').onclick=()=>{const txt=buildCmd(); try{navigator.clipboard.writeText(txt).then(()=>toast(t().copied),()=>selectCmd())}catch(e){selectCmd()}};
  $('bStart').onclick=()=>toast(t().launched+(find(S.sel).path||''));
  $('bReopen').onclick=()=>{S.on={};for(const k in S.pin)S.on[k]=true;renderMain();toast(t().reopened)};
}
function showTip(el){hideTip();const o=[...FLAGS,...ENVS].find(x=>x.id===el.dataset.tip);const row=el.closest('.row');
  const d=document.createElement('div');d.className='tip';d.id='tipEl';d.innerHTML=`<b>${esc(o.flag)}</b><br>${esc(o.t[S.lang])}`;row.appendChild(d);}
function hideTip(){const x=$('tipEl');if(x)x.remove()}
function selectCmd(){const r=document.createRange();r.selectNodeContents($('cmd'));const s=getSelection();s.removeAllRanges();s.addRange(r)}
let tTimer;function toast(msg){let el=$('toast');if(!el){el=document.createElement('div');el.className='toast';el.id='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=msg;el.hidden=false;clearTimeout(tTimer);tTimer=setTimeout(()=>el.hidden=true,2600)}

function openAbout(){
  const a=t().about;
  $('overlay').innerHTML=`<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="abT">
    <div class="mh"><span class="logo">iDeo</span><div><h3 id="abT">${esc(t().appname)}</h3><small>${esc(a.sub)} · v0.1.0</small></div></div>
    <dl class="mb">
      <dt>${esc(a.web)}</dt><dd><a href="https://ideonetworks.com/software/lanzador-claude" target="_blank" rel="noopener">ideonetworks.com/software/lanzador-claude</a></dd>
      <dt>${esc(a.tel)}</dt><dd><span class="mono" id="tel">+34 911 29 29 39</span><button class="mini" id="cpTel">${esc(a.copyBtn)}</button></dd>
      <dt>${esc(a.wa)}</dt><dd style="color:var(--muted)">${esc(a.soon)}</dd>
    </dl>
    <p class="madewith">${X[S.lang].made}</p>
    <div class="mf"><span>© iDeo Networks · ${esc(a.lic)}</span><button class="btn" id="cls">${esc(a.close)}</button></div>
  </div></div>`;
  const close=()=>{$('overlay').innerHTML=''};
  $('cls').onclick=close; $('mbg').onclick=e=>{if(e.target.id==='mbg')close()};
  $('cpTel').onclick=()=>{try{navigator.clipboard.writeText('+34911292939').then(()=>toast('+34 911 29 29 39'),()=>{})}catch(e){}};
  $('cls').focus();
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
}

function renderLegend(){const L=t().legend;
  $('legend').innerHTML=`<span><span class="cb pin on">${I.ok}</span>${esc(L[0])}</span><span><span class="cb chk on">${I.ok}</span>${esc(L[1])}</span>
   <span><span class="cb pin"></span><span class="cb chk on">${I.ok}</span>${esc(L[2])}</span><span><span class="cb pin on">${I.ok}</span><span class="cb chk on">${I.ok}</span>${esc(L[3])}</span>`;}

function renderAll(){
  const tt=t(); document.documentElement.lang=S.lang==='zh'?'zh-CN':S.lang;
  $('appname').textContent=tt.appname; $('searchph').textContent=tt.search; $('intro').innerHTML=tt.intro; $('lang').value=S.lang;
  renderNav();renderTree();renderMain();renderLegend();
  $('story').innerHTML=X[S.lang].story; renderStatus();
}
let engineUp=false;
function renderStatus(){$('status').classList.toggle('ok',engineUp);$('engine').textContent=engineUp?X[S.lang].connected:X[S.lang].connecting}
setTimeout(()=>{engineUp=true;renderStatus()},900);
$('lang').onchange=e=>{S.lang=e.target.value;save();renderAll()};
$('theme').onclick=()=>{const r=document.documentElement;const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.setAttribute('data-theme',cur==='dark'?'light':'dark')};
// first run: reopen semantics — only pinned are on
S.on={}; for(const k in S.pin) S.on[k]=true; S.on.continue=true;
renderAll();
})();
</script>
